<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder · Mr Chan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#18313F; --ink-2:#425B68; --ink-3:#5E6F75; --line:#DCE5E1; --line-2:#C9D6D1;
  --mint:#7ACDB4; --mint-l:#E3F4EE; --teal:#0B756E; --teal-d:#075650;
  --road:#DCE5E1; --road-done:#7ACDB4;
  --ease-out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.46,.64,1);
  --sh:0 1px 2px rgba(24,49,63,.05),0 14px 30px -18px rgba(24,49,63,.28);
  --sh-lg:0 30px 70px -30px rgba(24,49,63,.45),0 0 0 1px rgba(24,49,63,.04);
  --panel:400px; --panel-w:400px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
::selection{background:var(--mint);color:var(--ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
body.setup{--panel:var(--panel-w)} body:not(.setup){--panel:0px}

/* ---------- chrome ---------- */
.bar{position:fixed;left:0;top:0;right:var(--panel);height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:20;pointer-events:none;transition:right 360ms var(--ease-out)}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--sh)}
.brand svg{width:20px;height:20px}
.navbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);font-weight:600;font-size:13px;color:var(--teal);transition:background 150ms,transform 120ms}
.navbtn[hidden],.crumb[hidden]{display:none}
.navbtn:hover{background:var(--mint-l)}.navbtn:active{transform:scale(.97)}
.navbtn svg{width:16px;height:16px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 8px;box-shadow:var(--sh)}
.crumb b{color:var(--ink);font-weight:500;padding:4px 6px}
.crumb button{color:var(--teal);font-weight:500;padding:4px 6px;border-radius:7px}
.crumb button:hover{background:var(--mint-l)}
.spacer{flex:1}
.who{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px;gap:8px;box-shadow:var(--sh);font-size:13px;color:var(--ink-2)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:#fff;border:2px solid #fff;flex:none}
.av.s{background:var(--teal)} .av.t{background:#B8860B}
.who .av+.av{margin-left:-10px}
.hint{position:fixed;left:16px;bottom:16px;z-index:20;font-size:12px;color:var(--ink-3);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:12px}
.hint kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.zoom{position:fixed;right:calc(var(--panel) + 16px);bottom:16px;z-index:20;display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--sh);transition:right 360ms var(--ease-out)}
.zoom button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.zoom button:hover{background:var(--bg)}
.zoom svg{width:16px;height:16px}

/* ---------- canvas ---------- */
.viewport{position:absolute;inset:0;right:var(--panel);cursor:grab;touch-action:none;overflow:hidden;transition:right 360ms var(--ease-out);
  background:radial-gradient(circle at 1px 1px,#CFDAD5 1.2px,transparent 1.7px) 0 0/26px 26px,var(--bg)}
.viewport.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world.animate{transition:transform 680ms var(--ease-out)}
.layer{transition:opacity 220ms var(--ease-out)}
.layer.fade{opacity:0}
svg.roads{position:absolute;left:-4000px;top:-4000px;width:8000px;height:8000px;overflow:visible;pointer-events:none}
.road{fill:none;stroke:var(--road);stroke-width:24;stroke-linecap:round;stroke-linejoin:round;transition:opacity 300ms}
.road-dash{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:9 15;stroke-linecap:round;transition:opacity 300ms}
.road-done{fill:none;stroke:var(--road-done);stroke-width:24;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset 900ms var(--ease-out),opacity 300ms}
.road.draw,.road-dash.draw{transition:stroke-dashoffset 1100ms var(--ease-out)}
.spoke{fill:none;stroke:var(--line-2);stroke-width:2;stroke-dasharray:4 8;stroke-linecap:round;opacity:0;transition:opacity 500ms}
.spoke.on{opacity:1}
.trail-head{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:var(--sh);cursor:pointer;opacity:0;transition:opacity 400ms,left 600ms var(--ease-out),top 600ms var(--ease-out),box-shadow 200ms;white-space:nowrap}
.trail-head.on{opacity:1}
.trail-head .pct{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.trail-head .pct::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--card)}
.trail-head b{font-weight:600;font-size:13px}
.trail-head small{color:var(--ink-3);font-size:12px}
@media (hover:hover) and (pointer:fine){.trail-head:hover{box-shadow:0 22px 40px -20px rgba(24,49,63,.4)}}
.trail-head.dimmed{opacity:.3}
.trail-head.current{border-color:var(--teal)}

/* centre: teacher or venture */
.centre{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:grid;place-items:center;gap:12px;z-index:2}
.centre .orb{position:relative;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line),0 0 0 16px rgba(122,205,180,.14),0 0 0 32px rgba(122,205,180,.06),var(--sh)}
.centre .ring{position:absolute;inset:-12px;border-radius:50%;border:1.5px dashed var(--line-2);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.centre .pic{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--tint,var(--mint-l))}
.centre .pic svg{width:104px;height:104px}
.centre .pic.empty{background:var(--bg);border:2px dashed var(--line-2)}
.centre .pic.empty svg{width:34px;height:34px;color:var(--ink-3)}
.centre .owner{position:absolute;right:2px;bottom:2px;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:3px solid #fff;box-shadow:var(--sh)}
.centre .owner.t{background:#B8860B}
.centre .label{font-size:19px;font-weight:600;text-align:center;letter-spacing:-.01em}
.centre .label small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3);margin-top:3px}

/* case nodes on the teacher home */
.case{position:absolute;transform:translate(-50%,-50%) scale(.3);opacity:0;display:grid;justify-items:center;gap:10px;transition:transform 560ms var(--spring),opacity 260ms var(--ease-out)}
.case.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.case .disc{position:relative;width:124px;height:124px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line),var(--sh);display:grid;place-items:center;transition:transform 180ms var(--ease-out),box-shadow 180ms}
.case .disc .pic{width:98px;height:98px;border-radius:50%;background:var(--tint);display:grid;place-items:center;overflow:hidden}
.case .disc .pic svg{width:66px;height:66px}
.case .disc .pic[style*='color'] svg{width:34px;height:34px}
.case .disc .prog{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.case .disc .owner{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;border:3px solid #fff}
.case .name{font-size:14px;font-weight:600;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;box-shadow:var(--sh);max-width:190px}
.case .name small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
@media (hover:hover) and (pointer:fine){.case .disc:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--line),0 24px 44px -20px rgba(24,49,63,.45)}}
.case.new .disc{background:transparent;border:2px dashed var(--line-2);box-shadow:none}
.case.new .disc svg{width:30px;height:30px;color:var(--teal)}
.case.new .name{box-shadow:none;background:transparent;border-color:transparent;color:var(--ink-3);font-weight:500}

/* stops */
.stop{position:absolute;transform:translate(-50%,-50%) scale(.3);opacity:0;display:grid;justify-items:center;gap:8px;transition:transform 520ms var(--spring),opacity 260ms var(--ease-out),left 600ms var(--ease-out),top 600ms var(--ease-out)}
.stop.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.stop.dimmed{opacity:.28}
.stop .tile{position:relative;z-index:2;width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:var(--card);
  box-shadow:0 1px 0 #fff inset,0 8px 0 -2px var(--tint2),0 18px 26px -14px rgba(24,49,63,.3);transition:transform 180ms var(--ease-out),box-shadow 180ms}
.stop .tile svg{width:36px;height:36px;color:var(--c)}
.stop .name{position:relative;z-index:2;font-size:13.5px;font-weight:600;text-align:center;max-width:170px;line-height:1.25;background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px;box-shadow:var(--sh)}
.stop .name small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.stop.done .tile::after{content:"";position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--teal);border:3px solid var(--bg);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7'/></svg>");background-size:15px;background-repeat:no-repeat;background-position:center}
.stop.locked .tile{background:#EEF2F0;box-shadow:0 6px 0 -2px #C7D2CD,0 12px 18px -12px rgba(24,49,63,.2)}
.stop.locked .tile svg{color:#AEBBB5}
.stop.locked .name{color:var(--ink-3)}
.stop.current .tile{box-shadow:0 1px 0 #fff inset,0 8px 0 -2px var(--tint2),0 0 0 4px var(--bg),0 0 0 7px var(--teal),0 18px 26px -14px rgba(24,49,63,.3)}
.stop.active .tile{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.stop .tile:hover{transform:translateY(-3px)}}
.stop.ghost .tile{background:transparent;border:2px dashed var(--line-2);box-shadow:none}
.stop.ghost .tile svg{color:var(--teal)}
.stop.ghost .name{color:var(--ink-3);font-weight:500;box-shadow:none;background:transparent;border-color:transparent}

/* the artifact shelf: one card above each stop, never on the road */
.art{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%) scale(.72);transform-origin:50% 100%;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:10px 12px 12px;pointer-events:none;transition:transform 520ms var(--spring),opacity 300ms;z-index:1}
.art::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:18px;background:var(--line-2);transform:translateX(-50%)}
.art .cap{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.art .cap i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.stop.big .art{transform:translateX(-50%) scale(1)}
.stop.below .art{bottom:auto;top:calc(100% + 14px);transform-origin:50% 0}
.stop.below .art::after{top:auto;bottom:100%;height:14px}
.stop.locked .art{opacity:.55;filter:saturate(.3)}
.far .stop .art{opacity:0}
.far .stop .name{font-size:24px;padding:7px 16px}
.far .stop .name small{font-size:16px}
.far .trail-head b{font-size:16px}
.far .trail-head small{font-size:14px}
.far .case .name{font-size:17px}
.far .case .name small{font-size:13px}
.stop.locked .art .cap{color:var(--ink-3)}
.art .hand{font-family:"Caveat",cursive;font-size:17px;line-height:1.1;color:var(--ink)}
.art .cards{display:grid;gap:6px}
.art .cards div{background:var(--bg);border-radius:9px;padding:7px 9px;font-size:11px;color:var(--ink-2)}
.art .cards b{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:600;margin-bottom:1px}
.g4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:62px 62px;gap:4px;position:relative;margin:0 0 12px 12px}
.g4 div{background:var(--bg);border-radius:8px;font-size:9.5px;color:var(--ink-3);padding:5px 7px;position:relative;font-weight:500}
.pt{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--tint2);color:var(--ink);font-size:8px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.3)}
.ax{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--ink-3);white-space:nowrap}
.people{display:grid;gap:6px}
.person{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--ink-2)}
.person .face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:10px;position:relative;overflow:hidden}
.person .face svg{width:30px;height:30px}
.person .face.todo{background:var(--bg);border:2px dashed var(--line-2);color:var(--ink-3)}
.person b{display:block;font-weight:600;color:var(--ink);font-size:11.5px}
.person .st{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.person .st.ok{background:var(--mint-l);border-color:transparent;color:var(--teal)}
.g9{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:36px 36px 22px;gap:2px}
.g9 div{background:var(--bg);border-radius:4px;font-size:7.5px;color:var(--ink-3);padding:3px 4px;line-height:1.1}
.g9 .kp,.g9 .vp,.g9 .cs{grid-row:1/3}.g9 .cost{grid-column:1/3;grid-row:3}.g9 .rev{grid-column:3/6;grid-row:3}
.pips{display:flex;gap:4px}
.pips span{flex:1;text-align:center;padding:9px 2px;border-radius:8px;background:var(--bg);font-size:9.5px;font-weight:600;color:var(--ink-3)}
.pips span.f{background:var(--tint);color:var(--c)}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.quads div{background:var(--bg);border-radius:9px;padding:8px;font-weight:700;font-size:15px;color:var(--c)}
.quads small{display:block;font-size:9px;font-weight:500;color:var(--ink-3)}
.slides{display:flex;gap:5px}
.slides div{flex:1;aspect-ratio:16/10;background:var(--bg);border-radius:6px;font-size:8.5px;color:var(--ink-2);padding:5px 6px;font-weight:600}
.slides i{display:block;height:3px;border-radius:2px;background:var(--line-2);margin-top:4px;width:70%}
.slides i+i{width:45%}
.persona{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--ink-2)}
.persona .face{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--tint);display:grid;place-items:center;flex:none}
.persona .face svg{width:42px;height:42px}
.persona b{display:block;color:var(--ink);font-size:12px}

/* token */
.token{position:absolute;width:56px;transform:translate(-50%,-100%);pointer-events:none;transition:left 900ms var(--ease-out),top 900ms var(--ease-out);z-index:4}
.token .body{width:40px;height:40px;border-radius:50%;background:var(--teal);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border:3px solid #fff;box-shadow:0 10px 18px -8px rgba(11,117,110,.6);margin:0 auto}
.token .pin{width:0;height:0;margin:-2px auto 0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff}
.token.hop .body{animation:hop 900ms var(--ease-out)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-26px) scale(1.06)}100%{transform:translateY(0)}}

/* board (opens below the stop, so the artifact above stays visible) */
.board{position:absolute;width:640px;background:var(--card);color:var(--ink);border-radius:20px;box-shadow:var(--sh-lg);transform:scale(.08);opacity:0;transition:transform 520ms var(--spring),opacity 220ms var(--ease-out);z-index:6;display:grid;grid-template-columns:1.15fr 1fr}
.board.on{transform:none;opacity:1}
.board header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.board header .ic{width:38px;height:38px;border-radius:11px;background:var(--tint);display:grid;place-items:center}
.board header .ic svg{width:19px;height:19px;color:var(--c)}
.board h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.board .why{margin:1px 0 0;font-size:12.5px;color:var(--ink-2)}
.board .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.board .x:hover{background:var(--bg)}
.board .visual{padding:16px 18px 18px;border-right:1px solid var(--line)}
.board .visual .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.board .work{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.chip.k{background:var(--mint-l);border-color:transparent;color:var(--teal);font-weight:500}
.board .skills{display:flex;gap:5px;flex-wrap:wrap}
.board ol{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:3px}
.board li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;padding:7px 8px;border-radius:9px;font-size:13px}
.board li .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:10.5px;display:grid;place-items:center;color:var(--ink-3)}
.board li.done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.board li.cur{background:var(--tint)}
.board li.cur .n{border-color:var(--c);color:var(--c)}
.board li small{display:block;color:var(--ink-3);font-size:11.5px}
.board textarea{width:100%;min-height:64px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;background:#fff}
.board textarea:focus{outline:none;border-color:var(--teal)}
.board .actions{display:flex;gap:8px;align-items:center;margin-top:auto}
.btn{padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;background:var(--ink);color:#fff;transition:background 150ms,transform 120ms}
.btn:hover{background:#24465a}.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.btn.teal{background:var(--teal)}.btn.teal:hover{background:var(--teal-d)}
.board .answer{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--ink-2)}
.board .answer b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.board .answer p{margin:0;font-family:"Caveat",cursive;font-size:18px;line-height:1.15;color:var(--ink)}
.board .answer p.none{font-family:inherit;font-size:12.5px;color:var(--ink-3)}
.board .teacher-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto}

/* ---------- geometry ---------- */
function stopPos(t,i){ if(level==='path'&&focusTrail===t) return {x:FIRST+i*PGAP, y:0}; const a=t.dir*Math.PI/180, d=FIRST+i*GAP; return {x:Math.cos(a)*d, y:Math.sin(a)*d}; }
function pathD(t,count){ const start = (level==='path'&&focusTrail===t)?{x:100,y:0}:{x:Math.cos(t.dir*Math.PI/180)*100,y:Math.sin(t.dir*Math.PI/180)*100}; const pts=[start]; for(let i=0;i<count;i++) pts.push(stopPos(t,i));
  let d=`M${pts[0].x+OFF} ${pts[0].y+OFF}`; for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)]; d+=` C${p1.x+(p2.x-p0.x)/6+OFF} ${p1.y+(p2.y-p0.y)/6+OFF}, ${p2.x-(p3.x-p1.x)/6+OFF} ${p2.y-(p3.y-p1.y)/6+OFF}, ${p2.x+OFF} ${p2.y+OFF}`; } return d; }
function state(t,i){ const s=t.stops[i]; if(s.done>=CAT[s.id].steps.length) return 'done'; const prevDone=i===0||t.stops[i-1].done>=CAT[t.stops[i-1].id].steps.length; return prevDone?'current':'locked'; }
function sub(t,i){ const st=state(t,i), s=t.stops[i]; return st==='done'?'Complete':st==='current'?(s.done?`Step ${s.done+1} of ${CAT[s.id].steps.length}`:'Ready'):'Locked'; }
function progress(t){ const n=t.stops.filter((s,i)=>state(t,i)==='done').length; return {n,pct:Math.round(n/t.stops.length*100)}; }
function caseProgress(c){ const all=c.trails.flatMap(t=>t.stops.map((s,i)=>state(t,i)==='done')); return {n:all.filter(Boolean).length,total:all.length,pct:all.length?Math.round(all.filter(Boolean).length/all.length*100):0}; }

/* ---------- camera ---------- */
const cam={x:innerWidth/2,y:innerHeight/2,k:1};
function apply(anim){ world.classList.toggle('animate',!!anim&&!reduced); world.classList.toggle('far',cam.k<.84); world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; }
function flyTo(wx,wy,k,dy=0){ cam.k=k; cam.x=vw()/2-wx*k; cam.y=innerHeight/2-wy*k+dy; apply(true); }
function fitBox(minx,maxx,miny,maxy,kmax=1,anim=true,kmin=.26){ const k=Math.max(kmin,Math.min(kmax,(vw()-70)/(maxx-minx),(innerHeight-170)/(maxy-miny))); cam.k=k; cam.x=vw()/2-(minx+maxx)/2*k; cam.y=innerHeight/2-((miny+maxy)/2+16)*k; apply(anim); return k; }
function boxOf(margX,margTop,margBot){ let minx=-240,maxx=240,miny=-240,maxy=240; (cur?.trails||[]).forEach(t=>{ for(let i=0;i<t.stops.length;i++){ const p=stopPos(t,i); minx=Math.min(minx,p.x-margX);maxx=Math.max(maxx,p.x+margX);miny=Math.min(miny,p.y-margTop);maxy=Math.max(maxy,p.y+margBot);} }); return [minx,maxx,miny,maxy]; }
function fitLevel(anim=true){
  if(level==='teacher'){ fitBox(-CASE_R-150,CASE_R+150,-CASE_R-150,CASE_R+150,.95,anim,.8); return; }
  if(level==='path'&&focusTrail){ const t=focusTrail; let maxx=FIRST+t.stops.length*PGAP+140; fitBox(-130,maxx,-330,150,1.05,anim); return; }
  const full=boxOf(150,250,120); const kA=Math.min(.95,(vw()-70)/(full[1]-full[0]),(innerHeight-170)/(full[3]-full[2]));
  if(kA>=.85){ fitBox(...full,.95,anim); return; }
  const tight=boxOf(170,170,140); fitBox(...tight,.84,anim,.5);
}

/* ---------- trails ---------- */
function renderTrail(t,animate){
  const d=pathD(t,t.stops.length+1);
  if(!t.road){ t.road=mk('path',{d,class:'road'}); t.done=mk('path',{d,class:'road-done'}); t.dash=mk('path',{d,class:'road-dash'}); t.g=[t.road,t.done,t.dash]; } else t.g.forEach(p=>p.setAttribute('d',d));
  const L=t.road.getTotalLength();
  if(animate&&!reduced){ [t.road,t.dash].forEach(p=>{ p.style.strokeDasharray=p===t.dash?'9 15':L; p.style.strokeDashoffset=L; p.classList.remove('draw'); void p.getBoundingClientRect(); p.classList.add('draw'); p.style.strokeDashoffset=0; }); setTimeout(()=>{ t.road.style.strokeDasharray=''; t.road.style.strokeDashoffset=''; },1200); }
  let lastDone=-1; t.stops.forEach((s,i)=>{ if(state(t,i)==='done') lastDone=i; });
  const probe=document.createElementNS(NS,'path'); probe.setAttribute('d',pathD(t,lastDone+1)); t.done.style.strokeDasharray=L; t.done.style.strokeDashoffset=L-(lastDone<0?0:probe.getTotalLength());
  if(!t.head){ t.head=document.createElement('button'); t.head.className='trail-head'; layer.appendChild(t.head); t.head.addEventListener('click',()=>enterPath(t)); setTimeout(()=>t.head.classList.add('on'),animate&&!reduced?500:0); }
  const pr=progress(t); const focused=(level==='path'&&focusTrail===t); const a=t.dir*Math.PI/180; const hx=focused?150:Math.cos(a)*170+Math.sin(a)*78, hy=focused?-74:Math.sin(a)*170-Math.cos(a)*78;
  t.head.style.left=hx+'px'; t.head.style.top=hy+'px'; t.head.style.setProperty('--p',pr.pct); t.head.innerHTML=`<span class="pct"></span><span><b>${t.name}</b><br><small>${pr.n} of ${t.stops.length} stops</small></span>`; t.head.setAttribute('aria-label',`Open path ${t.name}, ${pr.n} of ${t.stops.length} stops complete`);
  t.stops.forEach((s,i)=>{
    const c=CAT[s.id], p=stopPos(t,i), st=state(t,i);
    if(!s.el){ s.el=document.createElement('div'); s.el.innerHTML=`<div class="art" aria-hidden="true"></div><button class="tile">${ICON[c.icon]}</button><div class="name">${c.title}<small></small></div>`; layer.appendChild(s.el);
      s.el.querySelector('.tile').addEventListener('click',()=>onStopClick(t,i)); setTimeout(()=>s.el.classList.add('on'),animate&&!reduced?420+i*160:0); }
    const keep=['on','big','active','dimmed'].filter(k=>s.el.classList.contains(k)); const below=!(level==='path'&&focusTrail===t)&&Math.sin(t.dir*Math.PI/180)<-0.1; s.el.className=`stop ${st} ${keep.join(' ')}${below?' below':''}`;
    s.el.style.cssText=`left:${p.x}px;top:${p.y}px;--c:${c.c};--tint:${c.tint};--tint2:${c.tint2}`;
    s.el.querySelector('.art').innerHTML=c.art(s.data||{}); s.el.querySelector('small').textContent=sub(t,i);
    const b=s.el.querySelector('.tile'); b.setAttribute('aria-label',`${c.title}, ${sub(t,i)}, on path ${t.name}`); if(st==='locked') b.setAttribute('aria-disabled','true'); else b.removeAttribute('aria-disabled');
  });
  const gp=stopPos(t,t.stops.length);
  if(!t.ghost){ t.ghost=document.createElement('div'); t.ghost.className='stop ghost'; t.ghost.innerHTML=`<button class="tile" aria-label="Add a stop to ${t.name}">${ICON.plus}</button><div class="name">Add a stop</div>`; layer.appendChild(t.ghost); t.ghost.querySelector('.tile').addEventListener('click',()=>{ setSetup(true); document.getElementById('composeIn').focus(); toast('Tell Wayfinder what to add'); }); }
  t.ghost.style.cssText=`left:${gp.x}px;top:${gp.y}px`; t.ghost.classList.toggle('on',level==='path'&&focusTrail===t);
}
function removeTrail(t){ t.g?.forEach(p=>p.remove()); t.head?.remove(); t.ghost?.remove(); t.stops.forEach(s=>s.el?.remove()); cur.trails.splice(cur.trails.indexOf(t),1); updateCentre(); }
function currentStop(t){ const i=t.stops.findIndex((s,i)=>state(t,i)==='current'); return i<0?t.stops.length-1:i; }
function placeToken(hop){ if(!activeTrail||!cur){ token.hidden=true; return; } token.hidden=false; token.querySelector('.body').textContent=cur.av||'?'; const i=currentStop(activeTrail), p=stopPos(activeTrail,i); token.style.left=p.x+'px'; token.style.top=(p.y-58)+'px'; if(hop&&!reduced){ token.classList.remove('hop'); void token.offsetWidth; token.classList.add('hop'); } }

/* ---------- path mode: the chosen path moves to the side and builds up ---------- */
function setBack(on,name,sub,to){ const b=document.getElementById('back'); b.classList.toggle('on',on); if(on){ document.getElementById('backName').textContent=name; document.getElementById('backSub').textContent=sub; document.getElementById('backTo').textContent=to; } }
function enterPath(t){
  closeBoard(false); level='path'; mode='path'; focusTrail=t; activeTrail=t; setSetup(false);
  cur.trails.forEach(o=>{ const on=o===t; o.head.classList.toggle('dimmed',!on); o.head.classList.toggle('current',on); o.g.forEach(p=>p.style.opacity=on?'':'.2'); o.stops.forEach(s=>s.el.classList.toggle('dimmed',!on)); });
  t.g.forEach(p=>p.style.opacity=0); renderTrail(t,false); setTimeout(()=>{ t.g.forEach(p=>p.style.opacity=''); },reduced?0:380);
  t.stops.forEach((s,i)=>{ s.el.classList.remove('big'); setTimeout(()=>s.el.classList.add('big'),reduced?0:500+i*200); });
  const pr=progress(t); setBack(true,t.name,`${pr.n} of ${t.stops.length} stops · ${cur.student}`,cur.name); crumb(); fitLevel(true); placeToken(false);
}
function exitPath(){ if(level!=='path') return; const t=focusTrail; closeBoard(false); level='case'; mode='overview'; focusTrail=null;
  cur.trails.forEach(o=>{ o.head.classList.remove('dimmed','current'); o.g.forEach(p=>p.style.opacity=''); o.stops.forEach(s=>s.el.classList.remove('big','dimmed')); });
  t.g.forEach(p=>p.style.opacity=0); renderTrail(t,false); setTimeout(()=>{ t.g.forEach(p=>p.style.opacity=''); },reduced?0:380);
  setBack(false); crumb(); fitLevel(true); placeToken(false); }
function onStopClick(t,i){ if(level!=='path'||focusTrail!==t){ enterPath(t); return; } openStop(t,i); }
document.getElementById('backBtn').addEventListener('click',exitPath);
document.getElementById('navBack').addEventListener('click',goBack);

/* ---------- board ---------- */
function openStop(t,i){
  const s=t.stops[i], c=CAT[s.id], st=state(t,i);
  if(st==='locked'){ toast(`${c.title} opens after ${CAT[t.stops[i-1].id].title}`); return; }
  closeBoard(false); open={t,i}; s.el.classList.add('active'); const p=stopPos(t,i);
  board=document.createElement('div'); board.className='board'; board.style.cssText=`left:${p.x-40}px;top:${p.y+86}px;transform-origin:40px 0;--c:${c.c};--tint:${c.tint};--tint2:${c.tint2}`;
  const stepI=Math.min(s.done,c.steps.length-1);
  board.innerHTML=`<header><span class="ic">${ICON[c.icon]}</span><div><h2>${c.title}</h2><p class="why">${c.why}</p></div><button class="x" aria-label="Close ${c.title}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="visual">${c.visual(s.data||{})}</div>
    <div class="work"><div class="skills">${c.skills.map(k=>`<span class="chip k">${SKILLS[k]}</span>`).join('')}<span class="chip">${t.name}</span></div>
      <ol>${c.steps.map((x,k)=>`<li class="${k<s.done?'done':k===stepI?'cur':''}"><span class="n">${k<s.done?'✓':k+1}</span><span>${x[0]}${x[1]?`<small>${x[1]}</small>`:''}</span></li>`).join('')}</ol>
      <div class="answer"><b>${cur.student}'s answer so far</b>${s.done>0?`<p>${(s.data&&s.data.text)||'Working on it. Last saved today.'}</p>`:`<p class="none">Nothing written yet.</p>`}</div>
      ${c.coach?`<div class="coach"><span class="av">MC</span><span>${c.coach}</span></div>`:''}
      <div class="teacher-actions"><button class="btn teal comment">Leave a comment</button><button class="btn ghost nudge">Nudge ${cur.student.split(' ')[0]}</button><label class="preview"><input type="checkbox" class="asStudent"> Preview as student</label></div>
      <div class="student-controls" hidden>${s.done<c.steps.length?`<textarea aria-label="Student answer for step ${stepI+1}" placeholder="${c.steps[stepI][0]}"></textarea>`:''}<div class="actions"><button class="btn teal next">${s.done>=c.steps.length?'Review':(stepI===c.steps.length-1?'Finish stop':'Next step')}</button><button class="btn ghost later">Later</button></div></div></div><span class="origin"></span>`;
  layer.appendChild(board); const bw=board.offsetWidth, bh=board.offsetHeight;
  board.querySelector('.x').addEventListener('click',()=>closeBoard(true)); board.querySelector('.later').addEventListener('click',()=>closeBoard(true)); board.querySelector('.next').addEventListener('click',()=>advance(t,i));
  board.querySelector('.asStudent').addEventListener('change',e=>{ board.querySelector('.student-controls').hidden=!e.target.checked; });
  board.querySelector('.nudge').addEventListener('click',()=>toast(`${cur.student} will see a gentle reminder about ${c.title}`));
  board.querySelector('.comment').addEventListener('click',e=>{ const w=board.querySelector('.work'); if(w.querySelector('.cbox')) return; const d=document.createElement('div'); d.className='cbox'; const first=cur.student.split(' ')[0]; d.innerHTML=`<textarea aria-label="Your comment for ${cur.student}" placeholder="A sentence ${first} will see on this stop"></textarea><div class="actions"><button class="btn teal save">Send to ${first}</button><button class="btn ghost cancel">Cancel</button></div>`; board.querySelector('.teacher-actions').insertAdjacentElement('beforebegin',d); d.querySelector('textarea').focus(); d.querySelector('.cancel').addEventListener('click',()=>d.remove()); d.querySelector('.save').addEventListener('click',()=>{ const v=d.querySelector('textarea').value.trim(); if(!v) return; c.coach=v; d.remove(); let cb=board.querySelector('.coach'); if(!cb){ cb=document.createElement('div'); cb.className='coach'; board.querySelector('.answer').insertAdjacentElement('afterend',cb); } cb.innerHTML=`<span class="av">MC</span><span>${v}</span>`; toast('Comment saved for '+cur.student); }); });
  const artH=s.el.querySelector('.art').offsetHeight+18+42; const top=p.y-artH, bottom=p.y+86+bh; const k=Math.max(.45,Math.min(1.05,(vw()-48)/bw,(innerHeight-160)/(bottom-top))); flyTo(p.x-40+bw/2,(top+bottom)/2,k,22);
  const b=board; setTimeout(()=>{ b.classList.add('on'); setTimeout(()=>b.querySelector('.x').focus(),80); },20);
}
function closeBoard(refocus){ if(!board) return; const b=board,o=open; b.classList.remove('on'); setTimeout(()=>b.remove(),reduced?0:260); if(o){ o.t.stops[o.i].el?.classList.remove('active'); if(refocus) o.t.stops[o.i].el?.querySelector('.tile').focus(); } board=null; open=null; }
function advance(t,i){
  const s=t.stops[i], c=CAT[s.id]; if(s.done>=c.steps.length){ closeBoard(true); return; } s.done++;
  if(s.done>=c.steps.length){ closeBoard(false); renderTrail(t,false); const nx=t.stops[i+1]; toast(nx?`${c.title} done. Next stop: ${CAT[nx.id].title}`:`${c.title} done. End of this path`);
    setTimeout(()=>{ placeToken(true); fitLevel(true); },reduced?0:150); const pr=progress(t); document.getElementById('backSub').textContent=`${pr.n} of ${t.stops.length} stops · ${cur.student}`; updateCentre(); }
  else { renderTrail(t,false); openStop(t,i); toast('Saved'); }
}

/* ---------- the panel: handle, drag to resize, click to toggle ---------- */
const handle=document.getElementById('handle');
function setSetup(on){ if(level==='teacher') on=false; document.body.classList.toggle('setup',on); handle.setAttribute('aria-expanded',String(on)); handle.setAttribute('aria-label',on?'Collapse Design the journey':'Open Design the journey'); crumb(); setTimeout(()=>{ if(board) apply(false); else fitLevel(true); },reduced?0:380); }
let hdrag=null;
handle.addEventListener('pointerdown',e=>{ hdrag={x:e.clientX,w:parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w'))||400,moved:false,open:document.body.classList.contains('setup')}; handle.setPointerCapture(e.pointerId); });
handle.addEventListener('pointermove',e=>{ if(!hdrag) return; const dx=e.clientX-hdrag.x; if(Math.abs(dx)>4) hdrag.moved=true; if(!hdrag.moved) return; document.body.classList.add('dragging');
  let w=hdrag.open?hdrag.w-dx:Math.min(560,Math.max(80,-dx)); if(!hdrag.open){ if(w>120){ document.body.classList.add('setup'); } w=Math.max(280,w); } else { w=Math.max(80,Math.min(560,w)); if(w<200) document.body.classList.remove('setup'); else document.body.classList.add('setup'); w=Math.max(280,w); }
  document.documentElement.style.setProperty('--panel-w',w+'px'); apply(false); });
handle.addEventListener('pointerup',e=>{ if(!hdrag) return; const moved=hdrag.moved, wasOpen=hdrag.open; hdrag=null; document.body.classList.remove('dragging');
  if(!moved){ setSetup(!wasOpen); } else { const on=document.body.classList.contains('setup'); setSetup(on); } });
handle.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setSetup(!document.body.classList.contains('setup')); } });

/* ---------- the design conversation ---------- */
const chat=document.getElementById('chat');
function say(html,me){ const m=document.createElement('div'); m.className='msg'+(me?' me':''); m.innerHTML=`<span class="av ${me?'t':'w'}">${me?'MC':'W'}</span><div class="b">${html}</div>`; chat.appendChild(m); chat.scrollTop=chat.scrollHeight; return m; }
async function think(ms){ const m=say('<span class="typing"><i></i><i></i><i></i></span>'); await new Promise(r=>setTimeout(r,reduced?0:ms)); m.remove(); }
function addTrail(tpl,animate){ const dir=tpl.dir!==undefined&&!cur.trails.some(t=>t.dir===tpl.dir)?tpl.dir:FREE_DIRS.find(d=>!cur.trails.some(t=>t.dir===d)); const t={name:tpl.name,dir,stops:tpl.stops.map(id=>({id,done:0,data:{}}))}; cur.trails.push(t); renderTrail(t,animate); updateCentre(); if(!activeTrail) activeTrail=t; placeToken(false); return t; }
function pathCards(){
  const m=say(`<p>Paths for <b>${cur.name}</b>. Switch one on and the canvas builds it. Single stops can be switched off.</p>${TEMPLATES.map(tp=>{ const have=cur.trails.find(t=>t.name===tp.name); return `<div class="pathcard ${have?'on':''}" data-id="${tp.id}"><div class="top"><span><b>${tp.name}</b><small>${tp.blurb}</small></span><button class="tgl" role="switch" aria-checked="${!!have}" aria-label="Use ${tp.name}"></button></div><div class="stops">${tp.stops.map(id=>`<button class="opt" data-stop="${id}" aria-pressed="${have?String(!!have.stops.find(s=>s.id===id)):'true'}" style="--c:${CAT[id].c}">${ICON[CAT[id].icon]}${CAT[id].title}</button>`).join('')}</div></div>`; }).join('')}`);
  m.querySelectorAll('.pathcard').forEach(card=>{ const tp=TEMPLATES.find(x=>x.id===card.dataset.id); const existing=cur.trails.find(t=>t.name===tp.name); if(existing) existing.card=card;
    card.querySelector('.tgl').addEventListener('click',()=>{ const on=card.classList.toggle('on'); card.querySelector('.tgl').setAttribute('aria-checked',String(on));
      if(on){ const chosen=[...card.querySelectorAll('[data-stop][aria-pressed=true]')].map(b=>b.dataset.stop); const t=addTrail({...tp,stops:chosen.length?chosen:tp.stops},true); t.card=card; fitLevel(true); toast(`${tp.name} added`); }
      else { const t=cur.trails.find(x=>x.card===card); if(t) removeTrail(t); fitLevel(true); } });
    card.querySelectorAll('[data-stop]').forEach(b=>b.addEventListener('click',()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',String(on)); const t=cur.trails.find(x=>x.card===card); if(!t) return;
      const chosen=[...card.querySelectorAll('[data-stop][aria-pressed=true]')].map(x=>x.dataset.stop); if(!chosen.length){ b.setAttribute('aria-pressed','true'); toast('A path needs at least one stop'); return; }
      t.stops.filter(s=>!chosen.includes(s.id)).forEach(s=>s.el.remove()); t.stops=chosen.map(id=>t.stops.find(s=>s.id===id)||{id,done:0,data:{}}); renderTrail(t,false); t.stops.forEach(s=>setTimeout(()=>s.el.classList.add('on'),20)); fitLevel(true); })); });
  document.getElementById('sugg').innerHTML=['A path about marketing','Add a design sprint to Understand the problem','Put a SWOT before the pitch'].map(s=>`<button type="button">${s}</button>`).join('');
}
async function buildConversation(c){
  chat.innerHTML=''; document.getElementById('sugg').innerHTML='';
  document.getElementById('panelSub').textContent=c.name?`${c.name} · ${c.student}`:'Tell Wayfinder about the new case. The canvas builds as you go.';
  if(c.name){ const pr=caseProgress(c); say(`<p><b>${c.name}</b> for ${c.student}: ${c.trails.length} path${c.trails.length!==1?'s':''}, ${pr.n} of ${pr.total} stops done.</p><p>Change the paths below, or tell me what to add.</p>`); pathCards(); return; }
  say(`<p>A new case. What is the venture called?</p><div class="field"><input type="text" id="qName" placeholder="For example: Green Lunchbox" aria-label="Venture name"><button class="btn teal" id="qNameGo">Set</button></div>`);
  const go=async()=>{ const v=document.getElementById('qName').value.trim(); if(!v) return; c.name=v; c.av=v.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); document.getElementById('qNameGo').disabled=true; document.getElementById('qName').disabled=true; say(v,true); updateCentre();
    await think(600);
    const m=say(`<p>Here are three pictures for <b>${v}</b>. Pick one, or keep going and change it later.</p><div class="pics">${['leaf','bubbles','shirt'].map(k=>`<button type="button" data-pic="${k}" aria-pressed="false" aria-label="Picture ${k}" style="--tint:${PICS[k].tint}">${PICS[k].svg}</button>`).join('')}</div><p style="margin-top:8px"><small style="color:var(--ink-3)">Sample pictures. The product would draw them from the venture's description.</small></p>`);
    m.querySelectorAll('[data-pic]').forEach(b=>b.addEventListener('click',()=>{ m.querySelectorAll('[data-pic]').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); c.pic=b.dataset.pic; updateCentre(); }));
    await think(500);
    say(`<p>Who is working on it?</p><div class="opts" id="qWho"><button class="opt" data-v="Jay Ng">Jay Ng, alone</button><button class="opt" data-v="Sara and Tom">Sara and Tom, as a pair</button><button class="opt" data-v="Group 5">Group 5</button></div>`);
    document.getElementById('qWho').addEventListener('click',async e=>{ const b=e.target.closest('.opt'); if(!b) return; c.student=b.dataset.v; [...e.currentTarget.children].forEach(x=>x.disabled=true); b.setAttribute('aria-pressed','true'); say(b.textContent,true); updateCentre(); await think(700); pathCards(); }); };
  document.getElementById('qNameGo').addEventListener('click',go); document.getElementById('qName').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
/* canned matching so the box feels alive; the real product would use the pathway composer */
async function compose(text){
  say(text,true); await think(800); const lower=text.toLowerCase(); let tpl=null, intoName=null, stopId=null;
  if(/market|story|brand|sell/.test(lower)&&!/add|put/.test(lower)){ tpl={name:'Reach our customers',stops:['persona','pitch']}; }
  else if(/swot/.test(lower)){ stopId='swot'; intoName=/pitch|story/.test(lower)?'Tell the story':null; }
  else if(/design|sprint|prototype/.test(lower)){ stopId='design'; }
  else if(/interview/.test(lower)){ stopId='interview'; } else if(/persona|customer/.test(lower)){ stopId='persona'; } else if(/canvas|business model/.test(lower)){ stopId='canvas'; } else if(/pitch/.test(lower)){ stopId='pitch'; }
  else { tpl={name:text.replace(/^(a |an |the )?(path|journey) (about|on|for) /i,'').replace(/^\w/,x=>x.toUpperCase()).slice(0,32),stops:['design','persona']}; }
  if(tpl){ const t=addTrail(tpl,true); fitLevel(true); say(`<p>Added a new path <b>${t.name}</b> with ${t.stops.map(s=>CAT[s.id].title).join(' and ')}.</p>`); return; }
  let t=intoName?cur.trails.find(x=>x.name===intoName):null; if(!t) t=cur.trails.find(x=>x.name.toLowerCase().split(' ').some(w=>w.length>3&&lower.includes(w)))||cur.trails[cur.trails.length-1];
  if(!t){ say(`<p>Switch on a path first, then I can add <b>${CAT[stopId].title}</b> to it.</p>`); return; }
  if(/before/.test(lower)&&t.stops.length) t.stops.splice(Math.max(0,t.stops.length-1),0,{id:stopId,done:0,data:{}}); else t.stops.push({id:stopId,done:0,data:{}});
  renderTrail(t,false); t.stops.forEach(s=>setTimeout(()=>s.el.classList.add('on'),30)); fitLevel(true); say(`<p>Added <b>${CAT[stopId].title}</b> to <b>${t.name}</b>. It unlocks after the stop before it.</p>`);
}
document.getElementById('composeForm').addEventListener('submit',e=>{ e.preventDefault(); const i=document.getElementById('composeIn'); const v=i.value.trim(); if(!v||!cur) return; i.value=''; compose(v); });
document.getElementById('sugg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) compose(b.textContent); });
document.getElementById('pclose').addEventListener('click',()=>setSetup(false));
document.getElementById('startBtn').addEventListener('click',()=>{ setSetup(false); toast(`${cur.name} is ready for ${cur.student||'the class'}`); });

/* ---------- toast, pan, zoom, keys ---------- */
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2000); }
let drag=null;
vp.addEventListener('pointerdown',e=>{ if(e.target.closest('button,textarea,input,.board')) return; drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; vp.classList.add('grabbing'); vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove',e=>{ if(!drag) return; cam.x=drag.cx+(e.clientX-drag.x); cam.y=drag.cy+(e.clientY-drag.y); apply(false); });
vp.addEventListener('pointerup',()=>{drag=null; vp.classList.remove('grabbing');});
function zoomAt(f,px,py,anim){ const k=Math.min(2.2,Math.max(.22,cam.k*f)); const r=k/cam.k; cam.x=px-(px-cam.x)*r; cam.y=py-(py-cam.y)*r; cam.k=k; apply(anim); }
vp.addEventListener('wheel',e=>{ if(e.target.closest('.board')) return; e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY,false); },{passive:false});
document.getElementById('zin').addEventListener('click',()=>zoomAt(1.25,vw()/2,innerHeight/2,true));
document.getElementById('zout').addEventListener('click',()=>zoomAt(.8,vw()/2,innerHeight/2,true));
document.getElementById('zfit').addEventListener('click',()=>{ closeBoard(false); fitLevel(true); });
vp.addEventListener('scroll',()=>{ vp.scrollLeft=0; vp.scrollTop=0; });
world.addEventListener('focusin',e=>{ vp.scrollLeft=0; vp.scrollTop=0; const r=e.target.getBoundingClientRect(); const m=90; if(r.left<m||r.top<m||r.right>vw()-m||r.bottom>innerHeight-m){ cam.x+=vw()/2-(r.left+r.width/2); cam.y+=innerHeight/2-(r.top+r.height/2); apply(true); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(board) closeBoard(true); else if(level==='path') exitPath(); else if(level==='case') leaveCase(); } });
addEventListener('resize',()=>{ if(board) apply(false); else fitLevel(false); });

/* start on the teacher's home */
apply(false); buildTeacher();
</script>
